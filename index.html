<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

/* =========================
   PAGES
========================= */

.page {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 50% 50%,
      #10233b 0%,
      #071321 28%,
      #020810 64%,
      #000 100%
    );

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 1s ease,
    visibility 1s ease;
}

.page.active {
  opacity: 1;
  visibility: visible;
}

/* =========================
   FIRST PAGE
========================= */

#home {
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
}

/* =========================
   CENTER BUTTON
========================= */

.center-wrap {
  position: relative;

  width: 180px;
  height: 180px;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 5;
}

.button {
  position: relative;

  width: 136px;
  height: 136px;

  border-radius: 50%;
  border: 1px solid rgba(150, 210, 255, 0.42);

  background:
    radial-gradient(
      circle at 42% 35%,
      #17385a 0%,
      #0c223a 45%,
      #050e19 100%
    );

  color: white;

  font-size: 14px;
  letter-spacing: 2px;
  font-weight: 600;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 0 20px rgba(65, 150, 255, 0.16),
    inset 0 0 25px rgba(100, 190, 255, 0.08);

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;

  z-index: 3;
}

.button:hover {
  transform: scale(1.045);

  box-shadow:
    0 0 34px rgba(75, 170, 255, 0.34),
    inset 0 0 30px rgba(100, 190, 255, 0.12);
}

/* =========================
   BUTTON SHINE
========================= */

.button.shine {
  animation: impact 0.8s ease-out;
}

@keyframes impact {

  0% {
    box-shadow:
      0 0 20px rgba(65, 150, 255, 0.16),
      inset 0 0 25px rgba(100, 190, 255, 0.08);
  }

  35% {
    box-shadow:
      0 0 85px 25px rgba(150, 220, 255, 0.85),
      0 0 150px 55px rgba(60, 150, 255, 0.35),
      inset 0 0 55px white;
  }

  100% {
    box-shadow:
      0 0 25px rgba(65, 150, 255, 0.22),
      inset 0 0 25px rgba(100, 190, 255, 0.08);
  }
}

/* =========================
   ORBITING BALL
========================= */

.orbit {
  position: absolute;

  width: 162px;
  height: 162px;

  border-radius: 50%;

  border: 1px solid transparent;

  pointer-events: none;

  opacity: 0;

  transition: opacity 0.2s ease;
}

.center-wrap:hover .orbit {
  opacity: 1;
}

.orbit::before {
  content: "";

  position: absolute;
  inset: -1px;

  border-radius: 50%;

  border: 1px solid rgba(130, 205, 255, 0.25);

  border-top-color: rgba(255, 255, 255, 0.75);
  border-right-color: rgba(90, 175, 255, 0.5);

  animation: spin 2.8s linear infinite;
}

.ball {
  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: white;

  left: 50%;
  top: -5px;

  transform: translateX(-50%);

  box-shadow:
    0 0 10px 3px rgba(180, 225, 255, 0.9);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================
   BACK BUTTON
========================= */

.back {
  position: absolute;

  top: 24px;
  left: 24px;

  width: 42px;
  height: 42px;

  border-radius: 50%;

  border: 1px solid rgba(160, 210, 255, 0.28);

  background: rgba(3, 10, 18, 0.55);

  backdrop-filter: blur(8px);

  color: rgba(255, 255, 255, 0.9);

  font-size: 25px;
  font-weight: 300;

  cursor: pointer;

  transition: 0.3s ease;

  z-index: 20;
}

.back:hover {
  border-color: rgba(180, 225, 255, 0.75);

  box-shadow:
    0 0 22px rgba(70, 160, 255, 0.22);
}

/* =========================
   CREDITS BUTTON
========================= */

.credits {
  position: absolute;

  top: 24px;
  right: 24px;

  padding: 11px 17px;

  border-radius: 20px;

  border: 1px solid rgba(160, 210, 255, 0.28);

  background: rgba(3, 10, 18, 0.55);

  backdrop-filter: blur(8px);

  color: rgba(255, 255, 255, 0.9);

  cursor: pointer;

  font-size: 11px;
  letter-spacing: 2px;

  transition: 0.3s ease;

  z-index: 20;
}

.credits:hover {
  border-color: rgba(180, 225, 255, 0.75);

  box-shadow:
    0 0 22px rgba(70, 160, 255, 0.22);
}

/* =========================
   CREDITS PANEL
========================= */

.credits-panel {
  position: absolute;

  top: 78px;
  right: 24px;

  width: min(300px, calc(100vw - 48px));

  padding: 22px;

  border:
    1px solid rgba(160, 210, 255, 0.25);

  border-radius: 14px;

  background: rgba(2, 9, 17, 0.86);

  backdrop-filter: blur(15px);

  text-align: center;

  opacity: 0;
  visibility: hidden;

  transform: translateY(-8px);

  transition: 0.35s ease;

  z-index: 30;

.credits-panel.show {
  opacity: 1;
  visibility: visible;

.credits-panel strong {

.credits-panel span {

/* =========================
   SECOND PAGE
========================= */

#awakening {
  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;
}

/* Title starts hidden and fades in */

.title-box {
  transform: translateY(18px);

  opacity: 0;

  transition:
    opacity 1.3s ease,
    transform 1.3s ease;
}

#awakening.active .title-box {
  opacity: 1;

  transform: translateY(0);
}

/* =========================
   TITLE
========================= */

h1 {
  font-size: clamp(48px, 9vw, 105px);

  letter-spacing:
    clamp(8px, 2.5vw, 28px);

  font-weight: 300;

  margin-left:
    clamp(8px, 2.5vw, 28px);

    0 0 30px rgba(120, 200, 255, 0.18);
}

/* =========================
   STATEMENT
========================= */

.statement {
  margin-top: 25px;

  font-size:
    clamp(12px, 1.5vw, 18px);

  letter-spacing:
    clamp(4px, 1vw, 11px);

  color:
    rgba(215, 235, 255, 0.72);

  margin-left:
    clamp(4px, 1vw, 11px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .back {
    left: 15px;
    top: 15px;
  }

  .credits {
    right: 15px;
    top: 15px;
  }

  .credits-panel {
    right: 15px;

  }

<body>

<!-- ==================================================
     PAGE 1 — AWAKENING BUTTON
================================================== -->

<section id="home" class="page active">

  <canvas id="rays"></canvas>

  <!-- Back -->
  <button
    class="back"
    id="homeBack"
    aria-label="Back"
    style="display:none;"
  >
    ←
  </button>

  <!-- Credits -->
  <button
    class="credits"
    id="creditsHome"
  >
    CREDITS
  </button>

  <!-- Credits popup -->
  <div
    class="credits-panel"
    id="panelHome"
  >
    <strong>INFIGENDS</strong>
    <span>all credits goes to mdju</span>
  </div>

  <!-- Center -->
  <div class="center-wrap">

    <!-- Revolving ball -->
    <div class="orbit">
      <div class="ball"></div>
    </div>

    <!-- Main button -->
    <button
      class="button"
      id="begin"
    >
      LET'S BEGIN
    </button>

  </div>

</section>


<!-- ==================================================
     PAGE 2 — TITLE + STATEMENT
================================================== -->

<section
  id="awakening"
  class="page"
>

  <!-- Back arrow -->
  <button
    class="back"
    id="backAwakening"
    aria-label="Back"
  >
    ←
  </button>

  <!-- Credits -->
  <button
    class="credits"
    id="creditsAwakening"
  >
    CREDITS
  </button>

  <!-- Credits popup -->
  <div
    class="credits-panel"
    id="panelAwakening"
  >
    <strong>INFIGENDS</strong>
    <span>all credits goes to mdju</span>
  </div>

  <!-- TITLE + STATEMENT -->
  <div class="title-box">

    <h1>
      INFIGENDS
    </h1>

    <p class="statement">
      THE AWAKENING OF RAGENS
    </p>

  </div>

</section>


<script>

/* ==================================================
   CANVAS SETUP
================================================== */

const canvas =
  document.getElementById("rays");

const ctx =
  canvas.getContext("2d");

const home =
  document.getElementById("home");

const awakening =
  document.getElementById("awakening");

const begin =
  document.getElementById("begin");


let w;
let h;
let dpr;


/* ==================================================
   RAY SETTINGS
================================================== */

const DURATION = 2800;

const ARRIVAL = 0.62;

const RADIUS = 68;


/* Animation clock */

let cycleStart =
  performance.now();

let hasShined =
  false;


/* ==================================================
   RESIZE
================================================== */

function resize() {

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  w =
    window.innerWidth;

  h =
    window.innerHeight;

  canvas.width =
    w * dpr;

  canvas.height =
    h * dpr;

  canvas.style.width =
    w + "px";

  canvas.style.height =
    h + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* ==================================================
   FIND POINT WHERE RAY TOUCHES BUTTON
================================================== */

function endpoint(
  x,
  y,
  cx,
  cy,
  r
) {

  const dx =
    cx - x;

  const dy =
    cy - y;

  const len =
    Math.hypot(dx, dy);

  return {

    x:
      cx -
      (dx / len) * r,

    y:
      cy -
      (dy / len) * r

  };

}


/* ==================================================
   DRAW RAYS
================================================== */

function draw(now) {

  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
    Don't draw rays on page 2.
  */

  if (
    !home.classList.contains("active")
  ) {

    requestAnimationFrame(draw);

    return;

  }


  /* Current animation time */

  let elapsed =
    now - cycleStart;


  /*
    Restart the ray cycle.
  */

  if (elapsed >= DURATION) {

    cycleStart =
      now;

    elapsed = 0;

    hasShined = false;

  }


  /*
    Overall progress.
  */

  const p =
    Math.min(
      elapsed / DURATION,
      1
    );


  /*
    Rays travel during first
    62% of the animation.
  */

  const travel =
    Math.min(
      p / ARRIVAL,
      1
    );


  /*
    Rays fade after reaching
    the center.
  */

  const fade =
    p > ARRIVAL

      ? 1 -
        (p - ARRIVAL) /
        (1 - ARRIVAL)

      : 1;


  /*
    Shine EXACTLY when rays
    reach the button.
  */

  if (
    p >= ARRIVAL &&
    !hasShined
  ) {

    hasShined = true;

    shine();

  }


  const cx =
    w / 2;

  const cy =
    h / 2;


  /*
    EXACTLY 8 RAYS:

    1. top-left corner
    2. top-right corner
    3. bottom-left corner
    4. bottom-right corner

    5. left-center
    6. right-center
    7. top-center
    8. bottom-center
  */

  const origins = [

    [0, 0],

    [w, 0],

    [0, h],

    [w, h],

    [0, cy],

    [w, cy],

    [cx, 0],

    [cx, h]

  ];


  ctx.lineCap =
    "round";


  origins.forEach(
    ([ox, oy]) => {

      /*
        Find exact point on
        button boundary.
      */

      const e =
        endpoint(
          ox,
          oy,
          cx,
          cy,
          RADIUS
        );


      /*
        Current ray position.
      */

      const x =
        ox +
        (e.x - ox) *
        travel;

      const y =
        oy +
        (e.y - oy) *
        travel;


      /*
        Gradient along the ray.
      */

      const grad =
        ctx.createLinearGradient(
          ox,
          oy,
          x,
          y
        );


      grad.addColorStop(
        0,
        `rgba(130,205,255,${0.05 * fade})`
      );

      grad.addColorStop(
        0.7,
        `rgba(180,225,255,${0.45 * fade})`
      );

      grad.addColorStop(
        1,
        `rgba(255,255,255,${0.95 * fade})`
      );


      ctx.strokeStyle =
        grad;

      ctx.shadowBlur =
        10;

      ctx.shadowColor =
        `rgba(110,195,255,${0.5 * fade})`;

      ctx.lineWidth =
        1.4;


      ctx.beginPath();

      ctx.moveTo(
        ox,
        oy
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.stroke();

    }
  );


  ctx.shadowBlur = 0;


  requestAnimationFrame(
    draw
  );

}


/* ==================================================
   BUTTON SHINE
================================================== */

function shine() {

  begin.classList.remove(
    "shine"
  );

  /*
    Force browser to restart
    the animation.
  */

  void begin.offsetWidth;

  begin.classList.add(
    "shine"
  );


  setTimeout(
    () => {

      begin.classList.remove(
        "shine"
      );

    },
    850
  );

}


/* Start animation */

requestAnimationFrame(
  draw
);


/* ==================================================
   LET'S BEGIN
================================================== */

function openAwakening() {

  /*
    Flash the button as the
    awakening happens.
  */

  shine();


  /*
    Then move to the SECOND PAGE.
  */

  setTimeout(
    () => {

      home.classList.remove(
        "active"
      );

      awakening.classList.add(
        "active"
      );

    },
    550
  );

}


begin.addEventListener(
  "click",
  openAwakening
);


/* ==================================================
   BACK ARROW
================================================== */

function goBack() {

  awakening.classList.remove(
    "active"
  );

  home.classList.add(
    "active"
  );


  /*
    Restart rays when returning.
  */

  cycleStart =
    performance.now();

  hasShined =
    false;

}


document
  .getElementById(
    "backAwakening"
  )
  .addEventListener(
    "click",
    goBack
  );


/* ==================================================
   CREDITS
================================================== */

function setupCredits(
  button,
  panel
) {

  button.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      panel.classList.toggle(
        "show"
      );

    }
  );


  /*
    Close credits when
    clicking elsewhere.
  */

  document.addEventListener(
    "click",
    event => {

      if (
        !panel.contains(
          event.target
        ) &&
        event.target !== button
      ) {

        panel.classList.remove(
          "show"
        );

      }

    }
  );

}


/* Credits on page 1 */

setupCredits(
  document.getElementById(
    "creditsHome"
  ),
  document.getElementById(
    "panelHome"
  )
);


/* Credits on page 2 */

setupCredits(
  document.getElementById(
    "creditsAwakening"
  ),
  document.getElementById(
    "panelAwakening"
  )
);

</script>

</body>
</html>
