<body>

<!-- =========================================
     PAGE 1
========================================= -->

<section
  id="home"

>

  <canvas id="rays"></canvas>

<!-- =========================================
     PAGE 2
========================================= -->

<section
  id="awakening"
  class="page"
>

  <!-- Back Arrow -->
  <button
    class="back"
    id="backAwakening"
    aria-label="Back"
  >
    ←
  </button>

  <!-- Credits -->
  <button
    class="credits"
    id="creditsAwakening"
  >
    CREDITS
  </button>

  <div
    class="credits-panel"
    id="panelAwakening"
  >
    <strong>INFIGENDS</strong>
    <span>all credits goes to mdju</span>
  </div>

  <!-- Title and Statement -->
  <div class="title-box">

    <h1>
      INFIGENDS
    </h1>

    <p class="statement">
      THE AWAKENING OF RAGENS
    </p>

  </div>

<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
  document.getElementById("rays");

const ctx =
  canvas.getContext("2d");

const home =
  document.getElementById("home");

const awakening =
  document.getElementById("awakening");

const begin =
  document.getElementById("begin");


let w;
let h;
let dpr;


/* =========================================
   RAY SETTINGS
========================================= */

const DURATION = 2800;

const ARRIVAL = 0.62;

const RADIUS = 68;

let cycleStart =
  performance.now();

let hasShined =
  false;


/* =========================================
   RESIZE
========================================= */

function resize() {

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  w =
    window.innerWidth;

  h =
    window.innerHeight;

  canvas.width =
    w * dpr;

  canvas.height =
    h * dpr;

  canvas.style.width =
    w + "px";

  canvas.style.height =
    h + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================
   FIND BUTTON BOUNDARY
========================================= */

function endpoint(
  x,
  y,
  cx,
  cy,
  r
) {

  const dx =
    cx - x;

  const dy =
    cy - y;

  const len =
    Math.hypot(
      dx,
      dy
    );

  return {

    x:
      cx -
      (dx / len) * r,

    y:
      cy -
      (dy / len) * r

  };

}


/* =========================================
   DRAW 8 RAYS
========================================= */

function draw(now) {

  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
    Only draw rays
    on the first page.
  */

  if (
    !home.classList.contains(
      "active"
    )
  ) {

    requestAnimationFrame(
      draw
    );

    return;

  }


  let elapsed =
    now - cycleStart;


  /*
    Restart animation.
  */

  if (
    elapsed >= DURATION
  ) {

    cycleStart =
      now;

    elapsed = 0;

    hasShined =
      false;

  }


  /*
    Animation progress.
  */

  const p =
    Math.min(
      elapsed / DURATION,
      1
    );


  /*
    Travel until 62%.
  */

  const travel =
    Math.min(
      p / ARRIVAL,
      1
    );


  /*
    Fade after arrival.
  */

  const fade =
    p > ARRIVAL

      ? 1 -
        (p - ARRIVAL) /
        (1 - ARRIVAL)

      : 1;


  /*
    Button shines at
    exact ray arrival.
  */

  if (
    p >= ARRIVAL &&
    !hasShined
  ) {

    hasShined =
      true;

    shine();

  }


  const cx =
    w / 2;

  const cy =
    h / 2;


  /*
    EXACTLY 8 RAYS:

    4 CORNERS

    4 SIDE CENTERS
  */

  const origins = [

    [0, 0],

    [w, 0],

    [0, h],

    [w, h],

    [0, cy],

    [w, cy],

    [cx, 0],

    [cx, h]

  ];


  ctx.lineCap =
    "round";


  origins.forEach(
    ([ox, oy]) => {

      const e =
        endpoint(
          ox,
          oy,
          cx,
          cy,
          RADIUS
        );


      const x =
        ox +
        (e.x - ox) *
        travel;

      const y =
        oy +
        (e.y - oy) *
        travel;


      /*
        Ray gradient.
      */

      const grad =
        ctx.createLinearGradient(
          ox,
          oy,
          x,
          y
        );


      grad.addColorStop(
        0,
        `rgba(
          130,
          205,
          255,
          ${0.05 * fade}
        )`
      );

      grad.addColorStop(
        0.7,
        `rgba(
          180,
          225,
          255,
          ${0.45 * fade}
        )`
      );

      grad.addColorStop(
        1,
        `rgba(
          255,
          255,
          255,
          ${0.95 * fade}
        )`
      );


      ctx.strokeStyle =
        grad;

      ctx.shadowBlur =
        10;

      ctx.shadowColor =
        `rgba(
          110,
          195,
          255,
          ${0.5 * fade}
        )`;

      ctx.lineWidth =
        1.4;


      ctx.beginPath();

      ctx.moveTo(
        ox,
        oy
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.stroke();

    }
  );


  ctx.shadowBlur =
    0;


  requestAnimationFrame(
    draw
  );

}


/* =========================================
   SHINE
========================================= */

function shine() {

  begin.classList.remove(
    "shine"
  );

  /*
    Restart CSS animation.
  */

  void begin.offsetWidth;

  begin.classList.add(
    "shine"
  );


  setTimeout(
    () => {

      begin.classList.remove(
        "shine"
      );

    },
    850
  );

}


/* Start ray animation */

requestAnimationFrame(
  draw
);


/* =========================================
   OPEN SECOND PAGE
========================================= */

function openAwakening() {

  /*
    Flash button.
  */

  shine();


  /*
    Transition to
    the second page.
  */

  setTimeout(
    () => {

      home.classList.remove(
        "active"
      );

      awakening.classList.add(
        "active"
      );

    },
    550
  );

}


begin.addEventListener(
  "click",
  openAwakening
);


/* =========================================
   BACK ARROW
========================================= */

function goBack() {

  awakening.classList.remove(
    "active"
  );

  home.classList.add(
    "active"
  );


  /*
    Restart ray animation.
  */

  cycleStart =
    performance.now();

  hasShined =
    false;

}


document
  .getElementById(
    "backAwakening"
  )
  .addEventListener(
    "click",
    goBack
  );


/* =========================================
   CREDITS
========================================= */

function setupCredits(
  button,
  panel
) {

  button.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      panel.classList.toggle(
        "show"
      );

    }
  );


  /*
    Close popup when
    clicking elsewhere.
  */

  document.addEventListener(
    "click",
    event => {

      if (
        !panel.contains(
          event.target
        ) &&
        event.target !== button
      ) {

        panel.classList.remove(
          "show"
        );

      }

    }
  );

}


/* Page 1 credits */

setupCredits(
  document.getElementById(
    "creditsHome"
  ),
  document.getElementById(
    "panelHome"
  )
);


/* Page 2 credits */

setupCredits(
  document.getElementById(
    "creditsAwakening"
  ),
  document.getElementById(
    "panelAwakening"
  )
);

</script>

</body>
</html>
