body {

        );

    align-items: center;

    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================
   BACKGROUND
========================================= */

.background {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 180, 255, 0.08),
            transparent 35%
        );

    pointer-events: none;
}


/* =========================================
   CANVAS
========================================= */

#energyCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================================
   CENTER BUTTON
========================================= */

.core {
    position: relative;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 10;

    cursor: pointer;
}


/* Actual button */

.core-button {

    width: 135px;
    height: 135px;

    border-radius: 50%;

    border: 2px solid rgba(90, 220, 255, 0.8);

    color: white;

    font-size: 15px;
    font-weight: bold;

    letter-spacing: 4px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #66eaff 0%,
            #0788d1 25%,
            #03416b 60%,
            #01111e 100%
        );

    box-shadow:
        0 0 15px rgba(0, 190, 255, .55),
        0 0 35px rgba(0, 160, 255, .3),
        inset 0 0 25px rgba(255,255,255,.15);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* Hover */

.core:hover .core-button {

    transform: scale(1.06);

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px rgba(0, 200, 255, .8),
        0 0 100px rgba(0, 150, 255, .45),
        inset 0 0 35px rgba(255,255,255,.25);
}


/* =========================================
   INNER CORE
========================================= */

.core-button::before {

    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    border: 1px solid rgba(180,245,255,.3);

    box-shadow:
        inset 0 0 25px rgba(0,220,255,.35);

    pointer-events: none;
}


/* =========================================
   BUTTON IMPACT SHINE
========================================= */

.core.shine .core-button {

    animation: coreImpact .75s ease-out;
}

    0% {

        transform: scale(1);

    }

    55% {

        box-shadow:

    }

        box-shadow:
            0 0 15px rgba(0,190,255,.55),
            0 0 35px rgba(0,160,255,.3);
    }
}
