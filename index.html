<script>

/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
  document.getElementById("rays");

const ctx =
  canvas.getContext("2d");

const home =
  document.getElementById("home");

const awakening =
  document.getElementById("awakening");

const begin =
  document.getElementById("begin");


/* =====================================================
   RAY SETTINGS
===================================================== */

let w=0;
let h=0;
let dpr=1;

const DURATION=2800;

/*
  All rays reach the button
  at the same moment.
*/
const ARRIVAL=.62;

/*
  Button radius.
*/
const RADIUS=70;

let cycleStart=
  performance.now();

let hasShined=false;


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  dpr=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  w=
    window.innerWidth;

  h=
    window.innerHeight;

  canvas.width=
    w*dpr;

  canvas.height=
    h*dpr;

  canvas.style.width=
    w+"px";

  canvas.style.height=
    h+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   BUTTON BOUNDARY
===================================================== */

function endpoint(
  x,
  y,
  cx,
  cy,
  r
){

  const dx=
    cx-x;

  const dy=
    cy-y;

  const len=
    Math.hypot(
      dx,
      dy
    );

  return{

    x:
      cx-
      (dx/len)*r,

    y:
      cy-
      (dy/len)*r

  };
}


/* =====================================================
   SHINE
===================================================== */

function shine(){

  begin.classList.remove(
    "shine"
  );

  /*
    Restart animation.
  */
  void begin.offsetWidth;

  begin.classList.add(
    "shine"
  );

  setTimeout(
    ()=>{
      begin.classList.remove(
        "shine"
      );
    },
    900
  );
}


/* =====================================================
   DRAW RAYS
===================================================== */

function draw(now){

  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
    Don't draw rays on page 2.
  */

  if(
    !home.classList.contains(
      "active"
    )
  ){

    requestAnimationFrame(
      draw
    );

    return;
  }


  let elapsed=
    now-cycleStart;


  /*
    Restart cycle.
  */

  if(
    elapsed>=DURATION
  ){

    cycleStart=
      now;

    elapsed=0;

    hasShined=false;
  }


  /*
    Overall progress.
  */

  const p=
    Math.min(
      elapsed/DURATION,
      1
    );


  /*
    Ray movement.
  */

  const travel=
    Math.min(
      p/ARRIVAL,
      1
    );


  /*
    Rays fade after
    reaching the button.
  */

  const fade=
    p>ARRIVAL

      ?

      1-
      (p-ARRIVAL)/
      (1-ARRIVAL)

      :

      1;


  /*
    EXACT IMPACT.
  */

  if(
    p>=ARRIVAL &&
    !hasShined
  ){

    hasShined=true;

    shine();
  }


  /*
    Center.
  */

  const cx=
    w/2;

  const cy=
    h/2;


  /*
    EXACTLY 8 RAYS.

    4 corners
    +
    4 side centers
  */

  const origins=[

    [0,0],

    [w,0],

    [0,h],

    [w,h],

    [0,cy],

    [w,cy],

    [cx,0],

    [cx,h]

  ];


  ctx.lineCap=
    "round";


  origins.forEach(
    ([ox,oy])=>{

      /*
        Find where the ray
        meets the button.
      */

      const e=
        endpoint(
          ox,
          oy,
          cx,
          cy,
          RADIUS
        );


      /*
        Current ray position.
      */

      const x=
        ox+
        (e.x-ox)*
        travel;

      const y=
        oy+
        (e.y-oy)*
        travel;


      /* -----------------------------------------
         SOFT ENERGY AURA
      ----------------------------------------- */

      ctx.beginPath();

      ctx.moveTo(
        ox,
        oy
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.strokeStyle=
        `rgba(
          80,
          180,
          255,
          ${.045*fade}
        )`;

      ctx.lineWidth=8;

      ctx.shadowBlur=22;

      ctx.shadowColor=
        `rgba(
          70,
          170,
          255,
          ${.18*fade}
        )`;

      ctx.stroke();


      /* -----------------------------------------
         SHARP RAY
      ----------------------------------------- */

      const grad=
        ctx.createLinearGradient(
          ox,
          oy,
          x,
          y
        );


      grad.addColorStop(
        0,
        `rgba(
          120,
          205,
          255,
          ${.025*fade}
        )`
      );

      grad.addColorStop(
        .55,
        `rgba(
          145,
          215,
          255,
          ${.20*fade}
        )`
      );

      grad.addColorStop(
        .88,
        `rgba(
          205,
          238,
          255,
          ${.58*fade}
        )`
      );

      grad.addColorStop(
        1,
        `rgba(
          255,
          255,
          255,
          ${.98*fade}
        )`
      );


      ctx.beginPath();

      ctx.moveTo(
        ox,
        oy
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.strokeStyle=
        grad;

      ctx.lineWidth=
        1.35;

      ctx.shadowBlur=9;

      ctx.shadowColor=
        `rgba(
          120,
          210,
          255,
          ${.55*fade}
        )`;

      ctx.stroke();

    }
  );


  ctx.shadowBlur=0;


  requestAnimationFrame(
    draw
  );
}


/* Start rays */

requestAnimationFrame(
  draw
);


/* =====================================================
   LET'S BEGIN
===================================================== */

function openAwakening(){

  /*
    Button impact.
  */

  shine();


  /*
    Move to second page.
  */

  setTimeout(
    ()=>{

      home.classList.remove(
        "active"
      );

      awakening.classList.add(
        "active"
      );

    },
    550
  );
}

begin.addEventListener(
  "click",
  openAwakening
);


/* =====================================================
   BACK ARROW
===================================================== */

function goBack(){

  awakening.classList.remove(
    "active"
  );

  home.classList.add(
    "active"
  );


  /*
    Restart the rays.
  */

  cycleStart=
    performance.now();

  hasShined=false;
}

document
  .getElementById(
    "backAwakening"
  )
  .addEventListener(
    "click",
    goBack
  );


/* =====================================================
   CREDITS
===================================================== */

function setupCredits(
  button,
  panel
){

  button.addEventListener(
    "click",
    event=>{

      event.stopPropagation();

      panel.classList.toggle(
        "show"
      );

    }
  );


  /*
    Close credits when
    clicking somewhere else.
  */

  document.addEventListener(
    "click",
    event=>{

      if(
        !panel.contains(
          event.target
        ) &&
        event.target!==button
      ){

        panel.classList.remove(
          "show"
        );
      }

    }
  );
}


/* Home credits */

setupCredits(
  document.getElementById(
    "creditsHome"
  ),
  document.getElementById(
    "panelHome"
  )
);


/* Second page credits */

setupCredits(
  document.getElementById(
    "creditsAwakening"
  ),
  document.getElementById(
    "panelAwakening"
  )
);

</script>
