<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INFIGENDS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   PAGE SYSTEM
========================================================= */

.page{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    transition:
        opacity 1.1s ease,
        visibility 1.1s ease;

    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(20,90,180,.30) 0%,
            rgba(5,30,75,.20) 22%,
            transparent 48%
        ),
        radial-gradient(
            ellipse at 15% 20%,
            rgba(35,80,190,.28),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 85% 15%,
            rgba(70,30,180,.24),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #020817 0%,
            #020511 48%,
            #000 100%
        );
}

.page.active{
    opacity:1;
    visibility:visible;
}

/* =========================================================
   COSMIC BACKGROUND
========================================================= */

.cosmos{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

/* nebula */

.nebula{
    position:absolute;
    width:120%;
    height:90%;
    left:-10%;
    top:0;

    background:
        radial-gradient(
            ellipse at 20% 35%,
            rgba(40,100,255,.35),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 75% 25%,
            rgba(70,35,255,.30),
            transparent 28%
        ),
        radial-gradient(
            ellipse at 52% 65%,
            rgba(0,160,255,.18),
            transparent 32%
        ),
        radial-gradient(
            ellipse at 88% 70%,
            rgba(190,40,220,.20),
            transparent 25%
        );

    filter:blur(28px);

    animation:
        nebulaMove 16s ease-in-out infinite alternate;
}

@keyframes nebulaMove{

    0%{
        transform:scale(1) translateX(-1%);
        opacity:.65;
    }

    100%{
        transform:scale(1.08) translateX(1%);
        opacity:1;
    }
}

/* =========================================================
   STARS
========================================================= */

.stars,
.stars2,
.stars3{
    position:absolute;
    inset:0;
    background-repeat:repeat;
    pointer-events:none;
}

.stars{
    opacity:.75;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 0 1px,
            transparent 1.7px
        );

    background-size:
        137px 113px;

    animation:
        starMove 30s linear infinite;
}

.stars2{
    opacity:.5;

    background-image:
        radial-gradient(
            circle,
            rgba(120,200,255,.9) 0 1.2px,
            transparent 2px
        );

    background-size:
        211px 179px;

    animation:
        starMove 50s linear infinite reverse;
}

.stars3{
    opacity:.35;

    background-image:
        radial-gradient(
            circle,
            rgba(190,150,255,.9) 0 1px,
            transparent 2px
        );

    background-size:
        293px 241px;

    animation:
        starMove 70s linear infinite;
}

@keyframes starMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(40px);
    }
}

/* =========================================================
   PLANETS
========================================================= */

.planet{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.planet.left{
    width:310px;
    height:310px;
    left:-135px;
    top:-120px;

    background:
        radial-gradient(
            circle at 62% 35%,
            #9edaff 0%,
            #2868b9 18%,
            #081d55 50%,
            #01030c 76%
        );

    box-shadow:
        0 0 30px rgba(70,160,255,.28),
        inset -35px -20px 60px rgba(0,0,0,.8);
}

.planet.right{
    width:260px;
    height:260px;
    right:-105px;
    top:-80px;

    background:
        radial-gradient(
            circle at 38% 40%,
            #9e8bff 0%,
            #3d38a5 25%,
            #10113f 58%,
            #01030d 78%
        );

    box-shadow:
        0 0 35px rgba(100,80,255,.30),
        inset 35px -25px 55px rgba(0,0,0,.75);
}

.planet::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1px solid rgba(120,200,255,.10);
}

/* =========================================================
   ASTEROIDS
========================================================= */

.asteroid{
    position:absolute;
    width:24px;
    height:18px;
    border-radius:45% 55% 50% 40%;
    background:
        linear-gradient(
            135deg,
            #27364c,
            #050812
        );
    box-shadow:
        0 0 12px rgba(50,130,255,.08);
    transform:rotate(28deg);
}

.a1{left:8%;top:25%;width:58px;height:38px}
.a2{left:19%;top:48%;width:30px;height:22px}
.a3{left:78%;top:31%;width:45px;height:31px}
.a4{left:91%;top:52%;width:60px;height:37px}
.a5{left:29%;top:12%;width:24px;height:18px}
.a6{left:69%;top:15%;width:30px;height:21px}
.a7{left:5%;top:66%;width:31px;height:20px}
.a8{left:84%;top:73%;width:35px;height:25px}

/* =========================================================
   HORIZON
========================================================= */

.horizon{
    position:absolute;
    left:-10%;
    width:120%;
    bottom:-7%;
    height:38%;

    background:
        linear-gradient(
            180deg,
            transparent 0%,
            rgba(15,65,120,.18) 20%,
            rgba(0,25,55,.55) 55%,
            #000 100%
        );

    transform:
        perspective(500px)
        rotateX(55deg);

    transform-origin:center bottom;

    opacity:.85;
}

/* glowing horizon line */

.horizon::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:5%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(80,190,255,.2),
            rgba(190,240,255,.9),
            rgba(80,190,255,.2),
            transparent
        );

    box-shadow:
        0 0 25px rgba(60,180,255,.8),
        0 0 80px rgba(50,120,255,.4);
}

/* water reflection */

.reflection{
    position:absolute;
    left:50%;
    bottom:0;

    width:360px;
    height:170px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(40,170,255,.34),
            rgba(20,90,190,.10) 35%,
            transparent 70%
        );

    filter:blur(7px);

    animation:
        reflectionPulse 3s ease-in-out infinite;
}

@keyframes reflectionPulse{

    0%,100%{
        opacity:.55;
        transform:
            translateX(-50%)
            scaleX(.8);
    }

    50%{
        opacity:1;
        transform:
            translateX(-50%)
            scaleX(1.15);
    }
}

/* =========================================================
   CINEMATIC LIGHT
========================================================= */

.light-column{
    position:absolute;

    left:50%;
    top:0;

    width:3px;
    height:100%;

    transform:translateX(-50%);

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(80,190,255,.03) 15%,
            rgba(80,190,255,.22) 48%,
            rgba(170,230,255,.7) 50%,
            rgba(80,190,255,.10) 70%,
            transparent
        );

    filter:
        blur(2px);

    opacity:.65;
}

/* =========================================================
   VIGNETTE
========================================================= */

.vignette{
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.18) 60%,
            rgba(0,0,0,.82) 100%
        );
}

/* =========================================================
   CONTROLS
========================================================= */

.back,
.credits{

    z-index:80;

    position:absolute;
    top:24px;

    border:
        1px solid rgba(130,210,255,.35);

    background:
        linear-gradient(
            145deg,
            rgba(15,50,90,.55),
            rgba(0,10,25,.62)
        );

    color:#fff;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    cursor:pointer;

    box-shadow:
        inset 0 1px rgba(255,255,255,.13),
        0 0 22px rgba(40,150,255,.12),
        0 15px 40px rgba(0,0,0,.5);

    transition:
        .35s ease;
}

.back{

    left:24px;

    width:46px;
    height:46px;

    border-radius:50%;

    font-size:26px;
    font-weight:200;
}

.credits{

    right:24px;

    padding:12px 20px;

    border-radius:30px;

    font-size:10px;

    letter-spacing:4px;
}

.back:hover,
.credits:hover{

    border-color:
        rgba(180,235,255,.9);

    box-shadow:
        0 0 30px rgba(60,190,255,.35),
        inset 0 0 15px rgba(100,200,255,.12);

    transform:
        translateY(-2px)
        scale(1.03);
}

/* =========================================================
   CREDITS PANEL
========================================================= */

.credits-panel{

    z-index:90;

    position:absolute;

    top:82px;
    right:24px;

    width:
        min(330px,calc(100vw - 48px));

    padding:28px;

    text-align:center;

    border:
        1px solid rgba(100,210,255,.4);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(4,30,65,.82),
            rgba(0,5,15,.94)
        );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 35px rgba(30,150,255,.16),
        0 25px 70px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.1);

    opacity:0;
    visibility:hidden;

    transform:
        translateY(-12px)
        scale(.95);

    transition:.35s ease;
}

.credits-panel.show{

    opacity:1;
    visibility:visible;

    transform:
        translateY(0)
        scale(1);
}

.credits-panel strong{

    display:block;

    font-size:13px;

    letter-spacing:6px;

    margin-bottom:14px;

    color:#e8f9ff;

    text-shadow:
        0 0 20px rgba(100,210,255,.8);
}

.credits-panel span{

    font-size:13px;

    color:
        rgba(220,240,255,.78);
}

/* =========================================================
   HOME
========================================================= */

#home{

    display:flex;

    align-items:center;
    justify-content:center;
}

#rays{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:15;
}

/* =========================================================
   CENTER PORTAL
========================================================= */

.center-wrap{

    position:relative;

    width:250px;
    height:250px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:25;
}

/* huge aura */

.center-wrap::before{

    content:"";

    position:absolute;

    width:330px;
    height:330px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(30,150,255,.14),
            transparent 65%
        );

    filter:blur(10px);

    animation:
        portalAura 3.5s ease-in-out infinite;
}

@keyframes portalAura{

    0%,100%{
        transform:scale(.88);
        opacity:.55;
    }

    50%{
        transform:scale(1.12);
        opacity:1;
    }
}

/* rings */

.ring1,
.ring2,
.ring3{

    position:absolute;

    border-radius:50%;

    pointer-events:none;
}

.ring1{

    width:235px;
    height:235px;

    border:
        1px solid rgba(90,200,255,.35);

    box-shadow:
        0 0 30px rgba(50,170,255,.12);

    animation:
        ringRotate 14s linear infinite;
}

.ring2{

    width:205px;
    height:205px;

    border:
        1px dashed rgba(110,210,255,.22);

    animation:
        ringRotate 10s linear infinite reverse;
}

.ring3{

    width:175px;
    height:175px;

    border:
        1px solid rgba(190,230,255,.16);

    animation:
        ringRotate 7s linear infinite;
}

@keyframes ringRotate{

    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   MAIN BUTTON
========================================================= */

.button{

    position:relative;

    width:140px;
    height:140px;

    border-radius:50%;

    border:
        1px solid rgba(190,235,255,.75);

    color:#fff;

    cursor:pointer;

    font-size:13px;

    font-weight:500;

    letter-spacing:3px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:30;

    background:
        radial-gradient(
            circle at 35% 25%,
            rgba(190,245,255,.65),
            rgba(50,160,255,.35) 16%,
            rgba(10,55,105,.92) 47%,
            #010712 78%
        );

    box-shadow:

        0 0 25px rgba(50,180,255,.45),

        0 0 70px rgba(30,140,255,.25),

        0 0 140px rgba(40,100,255,.13),

        inset 0 0 30px rgba(140,225,255,.32),

        inset 0 2px 3px rgba(255,255,255,.35);

    text-shadow:
        0 0 15px white,
        0 0 30px rgba(100,210,255,.8);

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}

.button:hover{

    transform:scale(1.07);

    box-shadow:

        0 0 35px rgba(80,200,255,.8),

        0 0 90px rgba(30,150,255,.45),

        0 0 170px rgba(50,120,255,.2),

        inset 0 0 45px rgba(190,240,255,.45);
}

/* button shine */

.button::before{

    content:"";

    position:absolute;

    width:70%;
    height:70%;

    left:-10%;
    top:-15%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.5),
            transparent 65%
        );

    filter:blur(5px);
}

.button::after{

    content:"";

    position:absolute;

    inset:8px;

    border-radius:50%;

    border:
        1px solid rgba(220,250,255,.18);
}

/* =========================================================
   ORBITING BALL
========================================================= */

.orbit{

    position:absolute;

    width:168px;
    height:168px;

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease;

    z-index:32;
}

.center-wrap:hover .orbit{
    opacity:1;
}

.orbit::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:50%;

    border:
        1px solid rgba(100,210,255,.35);

    border-top-color:#fff;

    border-right-color:
        rgba(70,190,255,.8);

    box-shadow:
        0 0 20px rgba(80,200,255,.3);

    animation:
        spin 2.2s linear infinite;
}

.orbit::after{

    content:"";

    position:absolute;

    inset:14px;

    border-radius:50%;

    border:
        1px dashed rgba(130,220,255,.12);

    animation:
        spin 5s linear infinite reverse;
}

.ball{

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#fff;

    left:50%;
    top:-5px;

    transform:
        translateX(-50%);

    box-shadow:
        0 0 12px 5px rgba(200,245,255,1),
        0 0 35px 10px rgba(50,180,255,.65);
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   IMPACT
========================================================= */

.button.shine{

    animation:
        impact .9s ease-out;
}

@keyframes impact{

    0%{
        transform:scale(1);
        filter:brightness(1);
    }

    20%{

        transform:scale(1.12);

        filter:brightness(2);

        box-shadow:

            0 0 50px 15px rgba(170,240,255,.9),

            0 0 130px 50px rgba(50,170,255,.6),

            0 0 220px 90px rgba(40,100,255,.25),

            inset 0 0 65px white;
    }

    45%{
        transform:scale(1.045);
        filter:brightness(1.4);
    }

    100%{
        transform:scale(1);
        filter:brightness(1);
    }
}

/* =========================================================
   SECOND PAGE
========================================================= */

#awakening{

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;
}

/* central celestial sphere */

.celestial{

    position:absolute;

    left:50%;
    top:50%;

    width:min(48vw,520px);
    height:min(48vw,520px);

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 48% 43%,
            rgba(45,120,255,.20),
            rgba(5,25,70,.45) 40%,
            rgba(0,0,15,.96) 70%
        );

    border:
        1px solid rgba(100,200,255,.45);

    box-shadow:

        0 0 45px rgba(50,170,255,.25),

        0 0 120px rgba(40,100,255,.16),

        inset 0 0 60px rgba(40,150,255,.25);

    animation:
        celestialPulse 6s ease-in-out infinite;
}

.celestial::before{

    content:"";

    position:absolute;

    inset:-14px;

    border-radius:50%;

    border:
        1px solid rgba(150,220,255,.24);

    box-shadow:
        0 0 35px rgba(60,180,255,.18);

    animation:
        spin 22s linear infinite;
}

.celestial::after{

    content:"";

    position:absolute;

    inset:-45px;

    border-radius:50%;

    border:
        1px solid rgba(100,200,255,.08);

    transform:
        rotateX(65deg);

    box-shadow:
        0 0 25px rgba(70,170,255,.08);
}

@keyframes celestialPulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.96);
        opacity:.75;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.03);
        opacity:1;
    }
}

/* title */

.title-box{

    position:relative;

    z-index:30;

    opacity:0;

    transform:
        translateY(30px)
        scale(.94);

    transition:
        opacity 1.5s ease,
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}

#awakening.active .title-box{

    opacity:1;

    transform:
        translateY(0)
        scale(1);
}

.title-box::before{

    content:"";

    position:absolute;

    width:min(90vw,1000px);
    height:450px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(40,150,255,.18),
            transparent 65%
        );

    filter:blur(25px);

    z-index:-1;
}

/* INFIGENDS */

h1{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(50px,10vw,125px);

    font-weight:400;

    line-height:.9;

    letter-spacing:
        clamp(7px,2vw,24px);

    margin-left:
        clamp(7px,2vw,24px);

    color:#f5fcff;

    text-shadow:

        0 0 5px white,

        0 0 15px rgba(130,220,255,.9),

        0 0 45px rgba(50,160,255,.65),

        0 0 100px rgba(40,100,255,.3);
}

/* statement */

.statement{

    margin-top:34px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(10px,1.5vw,18px);

    letter-spacing:
        clamp(4px,1vw,12px);

    margin-left:
        clamp(4px,1vw,12px);

    color:
        rgba(235,248,255,.86);

    text-shadow:
        0 0 15px rgba(100,200,255,.45);
}

/* decorative lines */

.statement::before,
.statement::after{

    content:"";

    display:inline-block;

    width:45px;

    height:1px;

    vertical-align:middle;

    margin:
        0 18px 4px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(170,230,255,.8)
        );

    box-shadow:
        0 0 12px rgba(100,200,255,.5);
}

.statement::after{

    background:
        linear-gradient(
            90deg,
            rgba(170,230,255,.8),
            transparent
        );
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .back{
        top:15px;
        left:15px;
    }

    .credits{
        top:15px;
        right:15px;
    }

    .credits-panel{
        top:70px;
        right:15px;
    }

    .center-wrap{
        transform:scale(.9);
    }

    .planet.left{
        width:190px;
        height:190px;
        left:-100px;
    }

    .planet.right{
        width:170px;
        height:170px;
        right:-90px;
    }

    .asteroid{
        transform:scale(.65);
    }

    .statement::before,
    .statement::after{
        width:15px;
        margin:0 7px 4px;
    }

    .celestial{
        width:360px;
        height:360px;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     HOME PAGE
===================================================== -->

<section id="home" class="page active">

    <!-- COSMIC WORLD -->

    <div class="cosmos">

        <div class="nebula"></div>

        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>

        <div class="planet left"></div>
        <div class="planet right"></div>

        <div class="asteroid a1"></div>
        <div class="asteroid a2"></div>
        <div class="asteroid a3"></div>
        <div class="asteroid a4"></div>
        <div class="asteroid a5"></div>
        <div class="asteroid a6"></div>
        <div class="asteroid a7"></div>
        <div class="asteroid a8"></div>

        <div class="horizon"></div>

        <div class="reflection"></div>

        <div class="light-column"></div>

    </div>


    <!-- RAYS -->

    <canvas id="rays"></canvas>


    <!-- CREDITS -->

    <button
        class="credits"
        id="creditsHome">
        CREDITS
    </button>


    <div
        class="credits-panel"
        id="panelHome">

        <strong>INFIGENDS</strong>

        <span>
            all credits goes to mdju
        </span>

    </div>


    <!-- CENTER -->

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("rays");

const ctx =
    canvas.getContext("2d");

const home =
    document.getElementById("home");

const awakening =
    document.getElementById("awakening");

const begin =
    document.getElementById("begin");


/* =========================================================
   RAY SYSTEM
========================================================= */

let w=0;
let h=0;
let dpr=1;

const DURATION=3000;

const ARRIVAL=.62;

const RADIUS=70;

let cycleStart=
    performance.now();

let hasShined=false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    dpr=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    w=
        window.innerWidth;

    h=
        window.innerHeight;

    canvas.width=
        w*dpr;

    canvas.height=
        h*dpr;

    canvas.style.width=
        w+"px";

    canvas.style.height=
        h+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   FIND BUTTON BOUNDARY
========================================================= */

function endpoint(
    x,
    y,
    cx,
    cy,
    r
){

    const dx=
        cx-x;

    const dy=
        cy-y;

    const len=
        Math.hypot(
            dx,
            dy
        );

    return {

        x:
            cx -
            (dx/len)*r,

        y:
            cy -
            (dy/len)*r
    };
}


/* =========================================================
   BUTTON SHINE
========================================================= */

function shine(){

    begin.classList.remove(
        "shine"
    );

    void begin.offsetWidth;

    begin.classList.add(
        "shine"
    );

    setTimeout(
        ()=>{
            begin.classList.remove(
                "shine"
            );
        },
        900
    );
}


/* =========================================================
   DRAW 8 CONVERGING RAYS
========================================================= */

function draw(now){

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    if(
        !home.classList.contains(
            "active"
        )
    ){

        requestAnimationFrame(
            draw
        );

        return;
    }


    let elapsed=
        now-cycleStart;


    /* restart */

    if(
        elapsed>=DURATION
    ){

        cycleStart=
            now;

        elapsed=0;

        hasShined=false;
    }


    const p=
        Math.min(
            elapsed/DURATION,
            1
        );


    /* ray travel */

    const travel=
        Math.min(
            p/ARRIVAL,
            1
        );


    /* fade after impact */

    const fade=
        p>ARRIVAL

        ?

        1-
        (p-ARRIVAL)/
        (1-ARRIVAL)

        :

        1;


    /* EXACT SAME MOMENT */

    if(
        p>=ARRIVAL &&
        !hasShined
    ){

        hasShined=true;

        shine();
    }


    const cx=
        w/2;

    const cy=
        h/2;


    /*
       EXACTLY 8 RAYS:

       4 CORNERS
       4 SIDE CENTERS
    */

    const origins=[

        [0,0],

        [w,0],

        [0,h],

        [w,h],

        [0,cy],

        [w,cy],

        [cx,0],

        [cx,h]

    ];


    ctx.lineCap=
        "round";


    origins.forEach(
        ([ox,oy])=>{

            const e=
                endpoint(
                    ox,
                    oy,
                    cx,
                    cy,
                    RADIUS
                );


            const x=
                ox+
                (e.x-ox)*
                travel;

            const y=
                oy+
                (e.y-oy)*
                travel;


            /* -------------------------------------
               HUGE SOFT ENERGY
            ------------------------------------- */

            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                `rgba(
                    30,
                    150,
                    255,
                    ${.06*fade}
                )`;

            ctx.lineWidth=12;

            ctx.shadowBlur=35;

            ctx.shadowColor=
                `rgba(
                    30,
                    160,
                    255,
                    ${.30*fade}
                )`;

            ctx.stroke();


            /* -------------------------------------
               CORE RAY
            ------------------------------------- */

            const gradient=
                ctx.createLinearGradient(
                    ox,
                    oy,
                    x,
                    y
                );


            gradient.addColorStop(
                0,
                `rgba(
                    70,
                    170,
                    255,
                    ${.02*fade}
                )`
            );


            gradient.addColorStop(
                .45,
                `rgba(
                    70,
                    190,
                    255,
                    ${.18*fade}
                )`
            );


            gradient.addColorStop(
                .80,
                `rgba(
                    130,
                    220,
                    255,
                    ${.55*fade}
                )`
            );


            gradient.addColorStop(
                1,
                `rgba(
                    255,
                    255,
                    255,
                    ${fade}
                )`
            );


            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                gradient;

            ctx.lineWidth=
                1.7;

            ctx.shadowBlur=
                14;

            ctx.shadowColor=
                `rgba(
                    80,
                    200,
                    255,
                    ${.8*fade}
                )`;

            ctx.stroke();

        }
    );


    ctx.shadowBlur=0;


    requestAnimationFrame(
        draw
    );
}

requestAnimationFrame(
    draw
);


/* =========================================================
   OPEN AWAKENING
========================================================= */

function openAwakening(){

    shine();

    setTimeout(
        ()=>{

            home.classList.remove(
                "active"
            );

            awakening.classList.add(
                "active"
            );

        },
        550
    );
}

begin.addEventListener(
    "click",
    openAwakening
);


/* =========================================================
   BACK
========================================================= */

function goBack(){

    awakening.classList.remove(
        "active"
    );

    home.classList.add(
        "active"
    );

    cycleStart=
        performance.now();

    hasShined=false;
}

document
    .getElementById(
        "backAwakening"
    )
    .addEventListener(
        "click",
        goBack
    );


/* =========================================================
   CREDITS
========================================================= */

function setupCredits(
    button,
    panel
){

    button.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            panel.classList.toggle(
                "show"
            );

        }
    );


    document.addEventListener(
        "click",
        event=>{

            if(
                !panel.contains(
                    event.target
                ) &&
                event.target!==button
            ){

                panel.classList.remove(
                    "show"
                );
            }

        }
    );
}


setupCredits(
    document.getElementById(
        "creditsHome"
    ),
    document.getElementById(
        "panelHome"
    )
);


setupCredits(
    document.getElementById(
        "creditsAwakening"
    ),
    document.getElementById(
        "panelAwakening"
    )
);

</script>

</body>
</html>
