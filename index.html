```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFIGENDS — The Awakening of Ragens</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

/* ---------- TITLE ---------- */

.title {
    position: absolute;
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    z-index: 10;
    pointer-events: none;
}

.title h1 {
    font-size: clamp(40px, 7vw, 90px);
    letter-spacing: 0.18em;
    font-weight: 800;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 30px rgba(120,180,255,0.7);
}

.title p {
    margin-top: 12px;
    font-size: clamp(11px, 1.5vw, 18px);
    letter-spacing: 0.45em;
    color: #b9d9ff;
}

/* ---------- CENTER ---------- */

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 180px;
    height: 180px;
    transform: translate(-50%, -50%);
    z-index: 20;
}

.button {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 130px;
    height: 130px;
    transform: translate(-50%, -50%);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.2em;

    background:
        radial-gradient(circle at 35% 30%,
        #ffffff 0%,
        #b8dfff 5%,
        #3177bd 25%,
        #071629 65%,
        #000 100%);

    border: 2px solid rgba(180,220,255,0.9);

    box-shadow:
        0 0 10px #6eb7ff,
        0 0 30px rgba(80,160,255,0.7),
        inset 0 0 25px rgba(150,210,255,0.5);

    transition: box-shadow 0.3s ease, transform 0.3s ease;
}

/* Shine when rays arrive */
.button.shine {
    animation: buttonShine 0.8s ease-out;
}

@keyframes buttonShine {
    0% {
        box-shadow:
            0 0 10px #6eb7ff,
            0 0 30px #6eb7ff;
    }

    50% {
        box-shadow:
            0 0 35px #fff,
            0 0 80px #6eb7ff,
            0 0 140px #2d8cff,
            inset 0 0 40px #fff;
    }

    100% {
        box-shadow:
            0 0 10px #6eb7ff,
            0 0 30px rgba(80,160,255,0.7);
    }
}

/* ---------- HOVER CIRCLE ---------- */

.orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 155px;
    height: 155px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #fff;
    border-right-color: #62b4ff;
    opacity: 0;
    pointer-events: none;
}

.button:hover + .orbit {
    opacity: 1;
    animation: orbitSpin 1.2s linear infinite;
}

.button:hover {
    transform: translate(-50%, -50%) scale(1.06);
}

@keyframes orbitSpin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

/* ---------- RAYS ---------- */

.rays {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.ray {
    position: absolute;
    height: 2px;
    width: 0;
    background: linear-gradient(
        to right,
        transparent,
        rgba(170,220,255,0.9),
        white
    );

    box-shadow:
        0 0 6px #6eb7ff,
        0 0 14px rgba(80,160,255,0.9);

    transform-origin: left center;

    animation: rayMove 3s ease-in-out infinite;
}

/* Corner rays */

.ray.tl {
    left: 0;
    top: 0;
    transform: rotate(43deg);
    animation-delay: 0s;
}

.ray.tr {
    right: 0;
    top: 0;
    transform-origin: right center;
    transform: rotate(-43deg);
    animation-delay: 0.15s;
}

.ray.bl {
    left: 0;
    bottom: 0;
    transform: rotate(-43deg);
    animation-delay: 0.3s;
}

.ray.br {
    right: 0;
    bottom: 0;
    transform-origin: right center;
    transform: rotate(43deg);
    animation-delay: 0.45s;
}

/* Side-center rays */

.ray.left {
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    animation-delay: 0.6s;
}

.ray.right {
    right: 0;
    top: 50%;
    transform-origin: right center;
    transform: translateY(-50%);
    animation-delay: 0.75s;
}

.ray.top {
    left: 50%;
    top: 0;
    width: 2px;
    height: 0;
    transform-origin: center top;
    animation: rayVertical 3s ease-in-out infinite;
    animation-delay: 0.9s;
}

.ray.bottom {
    left: 50%;
    bottom: 0;
    width: 2px;
    height: 0;
    transform-origin: center bottom;
    animation: rayVerticalBottom 3s ease-in-out infinite;
    animation-delay: 1.05s;
}

/* Horizontal ray movement */

@keyframes rayMove {

    0% {
        width: 0;
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    65% {
        width: 52%;
        opacity: 1;
    }

    82% {
        width: 52%;
        opacity: 0;
    }

    100% {
        width: 0;
        opacity: 0;
    }
}

/* Vertical rays */

@keyframes rayVertical {

    0% {
        height: 0;
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    65% {
        height: 42%;
        opacity: 1;
    }

    82% {
        height: 42%;
        opacity: 0;
    }

    100% {
        height: 0;
        opacity: 0;
    }
}

@keyframes rayVerticalBottom {

    0% {
        height: 0;
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    65% {
        height: 42%;
        opacity: 1;
    }

    82% {
        height: 42%;
        opacity: 0;
    }

    100% {
        height: 0;
        opacity: 0;
    }
}

/* ---------- STARS ---------- */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 0.9;
        transform: scale(1.5);
    }
}

/* Mobile */

@media (max-width: 600px) {

    .center {
        width: 150px;
        height: 150px;
    }

    .button {
        width: 105px;
        height: 105px;
        font-size: 11px;
    }

    .orbit {
        width: 125px;
        height: 125px;
    }

    .title {
        top: 8%;
    }

    .title p {
        letter-spacing: 0.25em;
    }
}
</style>
</head>

<body>

<!-- Stars -->
<div class="stars">
    <div class="star" style="left:8%;top:18%;"></div>
    <div class="star" style="left:17%;top:72%;animation-delay:.5s;"></div>
    <div class="star" style="left:29%;top:12%;animation-delay:1s;"></div>
    <div class="star" style="left:41%;top:84%;animation-delay:.3s;"></div>
    <div class="star" style="left:57%;top:17%;animation-delay:.8s;"></div>
    <div class="star" style="left:71%;top:76%;animation-delay:1.2s;"></div>
    <div class="star" style="left:83%;top:24%;animation-delay:.4s;"></div>
    <div class="star" style="left:93%;top:65%;animation-delay:1.4s;"></div>
    <div class="star" style="left:5%;top:45%;animation-delay:.9s;"></div>
    <div class="star" style="left:89%;top:48%;animation-delay:.2s;"></div>
</div>

<!-- Title -->
<div class="title">
    <h1>INFIGENDS</h1>
    <p>THE AWAKENING OF RAGENS</p>
</div>

<!-- Rays -->
<div class="rays">

    <!-- Corners -->
    <div class="ray tl"></div>
    <div class="ray tr"></div>
    <div class="ray bl"></div>
    <div class="ray br"></div>

    <!-- Side centers -->
    <div class="ray left"></div>
    <div class="ray right"></div>
    <div class="ray top"></div>
    <div class="ray bottom"></div>

</div>

<!-- Center -->
<div class="center">

    <div class="button" id="mainButton">
        RAGENS
    </div>

    <div class="orbit"></div>

</div>

<script>

/* Make the center button shine in sync with the ray cycle */

const button = document.getElementById("mainButton");

function shine() {
    button.classList.remove("shine");

    /* Force browser to restart animation */
    void button.offsetWidth;

    button.classList.add("shine");
}

/* Rays take roughly 3 seconds */
setInterval(shine, 3000);

/* First activation */
setTimeout(shine, 1800);

</script>

</body>
</html>
