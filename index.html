<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("rays");

const ctx =
    canvas.getContext("2d");

const home =
    document.getElementById("home");

const awakening =
    document.getElementById("awakening");

const begin =
    document.getElementById("begin");


/* =========================================================
   RAY SETTINGS
========================================================= */

let w=0;
let h=0;
let dpr=1;

const DURATION=3000;

/*
   Rays reach the button
   at exactly the same time.
*/
const ARRIVAL=.62;

/*
   Radius of the LET'S BEGIN
   button.
*/
const RADIUS=70;

let cycleStart=
    performance.now();

let hasShined=false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    dpr=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    w=
        window.innerWidth;

    h=
        window.innerHeight;

    canvas.width=
        w*dpr;

    canvas.height=
        h*dpr;

    canvas.style.width=
        w+"px";

    canvas.style.height=
        h+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   FIND BUTTON BOUNDARY
========================================================= */

function endpoint(
    x,
    y,
    cx,
    cy,
    r
){

    const dx=
        cx-x;

    const dy=
        cy-y;

    const len=
        Math.hypot(
            dx,
            dy
        );

    return{

        x:
            cx-
            (dx/len)*r,

        y:
            cy-
            (dy/len)*r
    };
}


/* =========================================================
   BUTTON SHINE
========================================================= */

function shine(){

    begin.classList.remove(
        "shine"
    );

    void begin.offsetWidth;

    begin.classList.add(
        "shine"
    );

    setTimeout(
        ()=>{
            begin.classList.remove(
                "shine"
            );
        },
        900
    );
}


/* =========================================================
   DRAW THE 8 RAYS
========================================================= */

function draw(now){

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    /*
       Rays only exist
       on the first page.
    */

    if(
        !home.classList.contains(
            "active"
        )
    ){

        requestAnimationFrame(
            draw
        );

        return;
    }


    let elapsed=
        now-cycleStart;


    /*
       Restart animation.
    */

    if(
        elapsed>=DURATION
    ){

        cycleStart=
            now;

        elapsed=0;

        hasShined=false;
    }


    /*
       Overall animation progress.
    */

    const p=
        Math.min(
            elapsed/DURATION,
            1
        );


    /*
       Travel progress.
    */

    const travel=
        Math.min(
            p/ARRIVAL,
            1
        );


    /*
       Fade after reaching
       the button.
    */

    const fade=
        p>ARRIVAL

        ?

        1-
        (p-ARRIVAL)/
        (1-ARRIVAL)

        :

        1;


    /*
       EXACT IMPACT MOMENT
    */

    if(
        p>=ARRIVAL &&
        !hasShined
    ){

        hasShined=true;

        shine();
    }


    /*
       Center of screen.
    */

    const cx=
        w/2;

    const cy=
        h/2;


    /*
       EXACTLY 8 RAYS:

       1. top-left
       2. top-right
       3. bottom-left
       4. bottom-right

       5. left-center
       6. right-center
       7. top-center
       8. bottom-center
    */

    const origins=[

        [0,0],
        [w,0],
        [0,h],
        [w,h],

        [0,cy],
        [w,cy],

        [cx,0],
        [cx,h]

    ];


    ctx.lineCap=
        "round";


    origins.forEach(
        ([ox,oy])=>{


            /*
               Calculate the exact
               point where the ray
               touches the button.
            */

            const e=
                endpoint(
                    ox,
                    oy,
                    cx,
                    cy,
                    RADIUS
                );


            /*
               Current position.
            */

            const x=
                ox+
                (e.x-ox)*
                travel;

            const y=
                oy+
                (e.y-oy)*
                travel;


            /* =================================================
               OUTER ENERGY GLOW
            ================================================= */

            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                `rgba(
                    40,
                    175,
                    255,
                    ${.09*fade}
                )`;

            ctx.lineWidth=
                13;

            ctx.shadowBlur=
                40;

            ctx.shadowColor=
                `rgba(
                    30,
                    170,
                    255,
                    ${.40*fade}
                )`;

            ctx.stroke();


            /* =================================================
               MAIN RAY
            ================================================= */

            const gradient=
                ctx.createLinearGradient(
                    ox,
                    oy,
                    x,
                    y
                );


            gradient.addColorStop(
                0,
                `rgba(
                    60,
                    170,
                    255,
                    ${.015*fade}
                )`
            );


            gradient.addColorStop(
                .40,
                `rgba(
                    80,
                    190,
                    255,
                    ${.22*fade}
                )`
            );


            gradient.addColorStop(
                .78,
                `rgba(
                    150,
                    225,
                    255,
                    ${.65*fade}
                )`
            );


            gradient.addColorStop(
                1,
                `rgba(
                    255,
                    255,
                    255,
                    ${fade}
                )`
            );


            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                gradient;

            ctx.lineWidth=
                1.8;

            ctx.shadowBlur=
                15;

            ctx.shadowColor=
                `rgba(
                    80,
                    210,
                    255,
                    ${.85*fade}
                )`;

            ctx.stroke();

        }
    );


    ctx.shadowBlur=0;


    requestAnimationFrame(
        draw
    );
}


requestAnimationFrame(
    draw
);


/* =========================================================
   LET'S BEGIN
========================================================= */

function openAwakening(){

    /*
       Final button flash.
    */

    shine();


    /*
       Switch to second screen.
    */

    setTimeout(
        ()=>{

            home.classList.remove(
                "active"
            );

            awakening.classList.add(
                "active"
            );

        },
        550
    );
}

begin.addEventListener(
    "click",
    openAwakening
);


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack(){

    awakening.classList.remove(
        "active"
    );

    home.classList.add(
        "active"
    );


    /*
       Restart rays immediately.
    */

    cycleStart=
        performance.now();

    hasShined=false;
}

document
    .getElementById(
        "backAwakening"
    )
    .addEventListener(
        "click",
        goBack
    );


/* =========================================================
   CREDITS
========================================================= */

function setupCredits(
    button,
    panel
){

    button.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            panel.classList.toggle(
                "show"
            );
        }
    );


    document.addEventListener(
        "click",
        event=>{

            if(
                !panel.contains(
                    event.target
                ) &&
                event.target!==button
            ){

                panel.classList.remove(
                    "show"
                );
            }

        }
    );
}


setupCredits(
    document.getElementById(
        "creditsHome"
    ),
    document.getElementById(
        "panelHome"
    )
);


setupCredits(
    document.getElementById(
        "creditsAwakening"
    ),
    document.getElementById(
        "panelAwakening"
    )
);

</script>

</body>
</html>
