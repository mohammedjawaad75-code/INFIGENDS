<title>INFIGENDS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    position:absolute;
    inset:0;

    opacity:0;
    visibility:hidden;

    overflow:hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.page.active{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   EXACT IMAGE BACKGROUND
========================================================= */

.bg{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    z-index:0;

    transform:scale(1.001);

    animation:
        slowZoom 18s ease-in-out infinite alternate;
}

#home .bg{
    background-image:url("infigends-home.jpg");
}

#awakening .bg{
    background-image:url("infigends-awakening.jpg");
}

@keyframes slowZoom{
    from{
        transform:scale(1.001);
    }

    to{
        transform:scale(1.025);
    }
}


/* =========================================================
   VERY LIGHT CINEMATIC OVERLAY
========================================================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,15,.10),
            transparent 35%,
            rgba(0,0,10,.25)
        );
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{
    position:absolute;
    inset:0;

    z-index:60;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.10) 65%,
            rgba(0,0,0,.55) 100%
        );
}


/* =========================================================
   CONTROLS
========================================================= */

.back,
.credits{

    position:absolute;

    top:24px;

    z-index:100;

    color:white;

    cursor:pointer;

    border:
        1px solid rgba(170,230,255,.65);

    background:
        rgba(0,12,30,.40);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

.back{

    height:46px;

    font-size:27px;

   RAYS

    height:100%;

/* =========================================================
   CENTER BUTTON SYSTEM
========================================================= */

.center-wrap{

    z-index:30;

    display:flex;

    align-items:center;

/* outer energy rings */

.ring{

}

.ring.one{

    border:

}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{

/* =========================================================
   BUTTON
========================================================= */

.button{

    position:relative;

    width:140px;
    height:140px;

    border-radius:50%;

    border:

    background:
        radial-gradient(

            rgba(5,55,110,.94) 48%,

    cursor:pointer;

    font-size:13px;

    font-weight:500;

    display:flex;

    align-items:center;

    z-index:40;

        0 0 25px rgba(50,190,255,.65),

        0 0 70px rgba(30,150,255,.40),

        0 0 130px rgba(40,100,255,.18),

        inset 0 0 35px rgba(160,235,255,.40),

        inset 0 2px 3px rgba(255,255,255,.35);

    text-shadow:

        0 0 30px #53cfff;

        transform .35s ease,

}

.button:hover{

/* =========================================================
   ORBITING BALL
========================================================= */

.orbit{

    position:absolute;

    width:168px;
    height:168px;

    border-radius:50%;

    opacity:0;

    z-index:45;

    pointer-events:none;

    transition:

}

.center-wrap:hover .orbit{
    opacity:1;
}

.orbit::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:50%;

    border:
        1px solid rgba(130,225,255,.40);

    border-top-color:white;

    border-right-color:#48bfff;

    box-shadow:
        0 0 20px rgba(80,210,255,.35);

    animation:
        orbitSpin 2.2s linear infinite;
}

.orbit::after{

    content:"";

    position:absolute;

    inset:14px;

    border-radius:50%;

    border:
        1px dashed rgba(150,230,255,.14);

    animation:
        orbitSpin 5s linear infinite reverse;
}

.ball{

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    left:50%;
    top:-5px;

    background:white;

    transform:
        translateX(-50%);

    box-shadow:
        0 0 12px 5px white,
        0 0 35px 10px rgba(50,190,255,.75);
}

@keyframes orbitSpin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   BUTTON IMPACT
========================================================= */

.button.shine{

    animation:
        impact .9s ease-out;
}

@keyframes impact{

    0%{
        transform:scale(1);
        filter:brightness(1);
    }

    20%{

        transform:scale(1.14);

        filter:brightness(2.2);

        box-shadow:

            0 0 55px 15px rgba(190,250,255,1),

            0 0 140px 55px rgba(50,180,255,.75),

            0 0 240px 100px rgba(40,110,255,.35),

            inset 0 0 70px white;
    }

    45%{

        transform:scale(1.05);

        filter:brightness(1.45);
    }

    100%{

        transform:scale(1);

        filter:brightness(1);
    }
}


/* =========================================================
   SECOND PAGE
========================================================= */

#awakening{

    display:flex;

   TITLE

<body>


<!-- =======================================================
     HOME

<section
    id="home"

>

    <!-- EXACT TOP HALF OF LATEST IMAGE -->

    <div class="bg"></div>

        class="credits"
        id="creditsHome">

    </button>

<!-- =======================================================

<section

    class="page"
>

        class="back"
        id="backAwakening">

        </span>

    <!-- TITLE -->

    <div class="title-box">

        <h1>

        </h1>

        <p class="statement">
            THE AWAKENING OF RAGENS
        </p>

    </div>


    <div class="vignette"></div>

</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("rays");

const ctx =
    canvas.getContext("2d");

const home =
    document.getElementById("home");

const awakening =
    document.getElementById("awakening");

const begin =
    document.getElementById("begin");


/* =========================================================
   RAY SETTINGS
========================================================= */

let w=0;
let h=0;
let dpr=1;

const DURATION=3000;

/* All rays arrive together */

const ARRIVAL=.62;

/* Button radius */

const RADIUS=70;

let cycleStart=
    performance.now();

let hasShined=false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    dpr=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    w=
        window.innerWidth;

    h=
        window.innerHeight;

    canvas.width=
        w*dpr;

    canvas.height=
        h*dpr;

    canvas.style.width=
        w+"px";

    canvas.style.height=
        h+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   BUTTON BOUNDARY
========================================================= */

function endpoint(
    x,
    y,
    cx,
    cy,
    r
){

    const dx=
        cx-x;

    const dy=
        cy-y;

    const len=
        Math.hypot(
            dx,
            dy
        );

    return{

        x:
            cx-
            (dx/len)*r,

        y:
            cy-
            (dy/len)*r

    };
}


/* =========================================================
   SHINE
========================================================= */

function shine(){

    begin.classList.remove(
        "shine"
    );

    void begin.offsetWidth;

    begin.classList.add(
        "shine"
    );

    setTimeout(
        ()=>{
            begin.classList.remove(
                "shine"
            );
        },
        900
    );
}


/* =========================================================
   8 RAY ANIMATION
========================================================= */

function draw(now){

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    if(
        !home.classList.contains(
            "active"
        )
    ){

        requestAnimationFrame(
            draw
        );

        return;
    }


    let elapsed=
        now-cycleStart;


    if(
        elapsed>=DURATION
    ){

        cycleStart=
            now;

        elapsed=0;

        hasShined=false;
    }


    const p=
        Math.min(
            elapsed/DURATION,
            1
        );


    /*
       Movement phase.
    */

    const travel=
        Math.min(
            p/ARRIVAL,
            1
        );


    /*
       Fade after impact.
    */

    const fade=
        p>ARRIVAL

        ?

        1-
        (p-ARRIVAL)/
        (1-ARRIVAL)

        :

        1;


    /*
       EXACT IMPACT.
    */

    if(
        p>=ARRIVAL &&
        !hasShined
    ){

        hasShined=true;

        shine();
    }


    const cx=
        w/2;

    const cy=
        h/2;


    /*
       8 origins:

       corners:
       1 top-left
       2 top-right
       3 bottom-left
       4 bottom-right

       sides:
       5 left
       6 right
       7 top
       8 bottom
    */

    const origins=[

        [0,0],
        [w,0],
        [0,h],
        [w,h],

        [0,cy],
        [w,cy],

        [cx,0],
        [cx,h]

    ];


    ctx.lineCap="round";


    origins.forEach(
        ([ox,oy])=>{

            const e=
                endpoint(
                    ox,
                    oy,
                    cx,
                    cy,
                    RADIUS
                );


            const x=
                ox+
                (e.x-ox)*
                travel;

            const y=
                oy+
                (e.y-oy)*
                travel;


            /* -----------------------------------------
               SOFT GLOW
            ----------------------------------------- */

            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                `rgba(
                    30,
                    170,
                    255,
                    ${.09*fade}
                )`;

            ctx.lineWidth=12;

            ctx.shadowBlur=35;

            ctx.shadowColor=
                `rgba(
                    40,
                    180,
                    255,
                    ${.35*fade}
                )`;

            ctx.stroke();


            /* -----------------------------------------
               BRIGHT CORE
            ----------------------------------------- */

            const gradient=
                ctx.createLinearGradient(
                    ox,
                    oy,
                    x,
                    y
                );


            gradient.addColorStop(
                0,
                `rgba(
                    60,
                    180,
                    255,
                    ${.02*fade}
                )`
            );


            gradient.addColorStop(
                .45,
                `rgba(
                    90,
                    200,
                    255,
                    ${.25*fade}
                )`
            );


            gradient.addColorStop(
                .80,
                `rgba(
                    160,
                    230,
                    255,
                    ${.70*fade}
                )`
            );


            gradient.addColorStop(
                1,
                `rgba(
                    255,
                    255,
                    255,
                    ${fade}
                )`
            );


            ctx.beginPath();

            ctx.moveTo(
                ox,
                oy
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle=
                gradient;

            ctx.lineWidth=1.8;

            ctx.shadowBlur=14;

            ctx.shadowColor=
                `rgba(
                    100,
                    220,
                    255,
                    ${.85*fade}
                )`;

            ctx.stroke();

        }
    );


    ctx.shadowBlur=0;


    requestAnimationFrame(
        draw
    );
}


requestAnimationFrame(
    draw
);


/* =========================================================
   LET'S BEGIN
========================================================= */

begin.addEventListener(
    "click",
    ()=>{

        shine();

        setTimeout(
            ()=>{

                home.classList.remove(
                    "active"
                );

                awakening.classList.add(
                    "active"
                );

            },
            550
        );

    }
);


/* =========================================================
   BACK
========================================================= */

document
    .getElementById(
        "backAwakening"
    )
    .addEventListener(
        "click",
        ()=>{

            awakening.classList.remove(
                "active"
            );

            home.classList.add(
                "active"
            );

            cycleStart=
                performance.now();

            hasShined=false;

        }
    );


/* =========================================================
   CREDITS
========================================================= */

function setupCredits(
    button,
    panel
){

    button.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            panel.classList.toggle(
                "show"
            );

        }
    );


    document.addEventListener(
        "click",
        event=>{

            if(
                !panel.contains(
                    event.target
                ) &&
                event.target!==button
            ){

                panel.classList.remove(
                    "show"
                );
            }

        }
    );
}


setupCredits(
    document.getElementById(
        "creditsHome"
    ),
    document.getElementById(
        "panelHome"
    )
);


setupCredits(
    document.getElementById(
        "creditsAwakening"
    ),
    document.getElementById(
        "panelAwakening"
    )
);

</script>

</body>
</html>
