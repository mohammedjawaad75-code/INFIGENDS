<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>INFIGENDS</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #020409;
}


/* =========================================================
   HOME
========================================================= */

.home {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;
    align-items: center;

    background:

        radial-gradient(
            circle at center,

            #182832 0%,

            #0b1218 35%,

            #04070b 70%,

            #010204 100%
        );

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

}


/* =========================================================
   GIANT BACKGROUND WORD
========================================================= */

.background-title {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size:
        clamp(
            100px,
            24vw,
            400px
        );

    font-weight: 900;

    letter-spacing: 25px;

    color:
        rgba(
            0,
            191,
            255,
            0.025
        );

    white-space: nowrap;

    user-select: none;

    animation:
        breathe
        5s ease-in-out infinite;

}


/* =========================================================
   CENTRAL ENERGY
========================================================= */

.energy-core {

    position: absolute;

    width: 360px;
    height: 360px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            rgba(
                0,
                220,
                255,
                0.20
            ) 0%,

            rgba(
                0,
                170,
                255,
                0.08
            ) 35%,

            transparent 70%
        );

    filter:
        blur(10px);

    animation:
        corePulse
        3s ease-in-out infinite;

    pointer-events: none;

}


/* =========================================================
   RAY CONTAINER
========================================================= */

.ray-container {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 3;

}


/* =========================================================
   RAY BASE
========================================================= */

.ray {

    position: absolute;

    width: 3px;

    height: 55vh;

    border-radius: 100%;

    background:

        linear-gradient(
            to top,

            transparent 0%,

            #00aaff 25%,

            #00eaff 70%,

            white 100%
        );

    box-shadow:

        0 0 5px #00d9ff,

        0 0 12px #00bfff,

        0 0 25px #00bfff;

    opacity: 0;

}


/*
=========================================================
   RAYS FROM TOP
=========================================================
*/

.ray.top {

    left: 50%;

    top: -55vh;

    transform-origin:
        center bottom;

    animation:
        rayFromTop
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


/*
=========================================================
   RAYS FROM BOTTOM
=========================================================
*/

.ray.bottom {

    left: 50%;

    bottom: -55vh;

    transform-origin:
        center top;

    animation:
        rayFromBottom
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


/*
=========================================================
   RAYS FROM LEFT
=========================================================
*/

.ray.left {

    left: -55vh;

    top: 50%;

    transform-origin:
        right center;

    transform:
        rotate(90deg);

    animation:
        rayFromLeft
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


/*
=========================================================
   RAYS FROM RIGHT
=========================================================
*/

.ray.right {

    right: -55vh;

    top: 50%;

    transform-origin:
        left center;

    transform:
        rotate(-90deg);

    animation:
        rayFromRight
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


/* =========================================================
   EXTRA DIAGONAL RAYS
========================================================= */

.ray.diagonal {

    width: 2px;

    height: 65vh;

}


.ray.tl {

    left: -5%;

    top: -45vh;

    transform:
        rotate(-42deg);

    transform-origin:
        bottom center;

    animation:
        diagonalTL
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


.ray.tr {

    right: -5%;

    top: -45vh;

    transform:
        rotate(42deg);

    transform-origin:
        bottom center;

    animation:
        diagonalTR
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


.ray.bl {

    left: -5%;

    bottom: -45vh;

    transform:
        rotate(42deg);

    transform-origin:
        top center;

    animation:
        diagonalBL
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


.ray.br {

    right: -5%;

    bottom: -45vh;

    transform:
        rotate(-42deg);

    transform-origin:
        top center;

    animation:
        diagonalBR
        2s
        cubic-bezier(
            0.15,
            0.75,
            0.25,
            1
        )
        infinite;

}


/* =========================================================
   MAIN BUTTON
========================================================= */

.begin {

    position: relative;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    border:
        2px solid
        #6eeeff;

    background:

        radial-gradient(
            circle,

            rgba(
                0,
                220,
                255,
                0.35
            ),

            rgba(
                0,
                80,
                120,
                0.15
            ) 45%,

            rgba(
                0,
                0,
                0,
                0.7
            )
        );

    color: white;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 3px;

    text-transform: uppercase;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:

        0 0 15px #00d9ff,

        0 0 35px
        rgba(
            0,
            191,
            255,
            0.65
        ),

        inset
        0 0 25px
        rgba(
            0,
            220,
            255,
            0.25
        );

    z-index: 10;

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;

}


/* =========================================================
   DAZZLING CIRCLE AROUND BUTTON
========================================================= */

.begin .dazzle {

    position: absolute;

    inset: -12px;

    border-radius: 50%;

    pointer-events: none;

    opacity: 0;

}


/*
   The glowing travelling point
*/

.begin .dazzle::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 8px white,

        0 0 18px #00eaff,

        0 0 35px #00bfff,

        0 0 60px #00bfff;

    top: -9px;

    left: 50%;

    transform:
        translateX(-50%);

}


/*
   Only activate the circle
   while cursor is on button.
*/

.begin:hover .dazzle {

    opacity: 1;

    animation:
        orbit
        1.2s
        linear
        infinite;

}


/* =========================================================
   BUTTON HOVER
========================================================= */

.begin:hover {

    transform:
        scale(1.08);

    box-shadow:

        0 0 20px white,

        0 0 45px #00eaff,

        0 0 90px #00bfff,

        0 0 150px
        rgba(
            0,
            191,
            255,
            0.7
        ),

        inset
        0 0 45px
        rgba(
            255,
            255,
            255,
            0.35
        );

}


/* =========================================================
   CREDITS BUTTON
========================================================= */

.credits-button {

    position: absolute;

    top: 35px;
    right: 40px;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    border:
        2px solid
        #55e7ff;

    background:
        rgba(
            0,
            120,
            170,
            0.12
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:

        0 0 15px #00bfff,

        inset
        0 0 15px
        rgba(
            0,
            210,
            255,
            0.2
        );

    transition:
        0.4s ease;

    z-index: 20;

}


.credits-button:hover {

    transform:
        scale(1.1);

    box-shadow:

        0 0 20px #00eaff,

        0 0 50px #00bfff;

}


/* =========================================================
   CORNER DECORATION
========================================================= */

.corner {

    position: absolute;

    width: 80px;
    height: 80px;

    border:
        1px solid
        rgba(
            0,
            200,
            255,
            0.3
        );

    pointer-events: none;

}


.corner.top-left {

    top: 25px;
    left: 25px;

    border-width:
        1px 0 0 1px;

}


.corner.bottom-right {

    bottom: 25px;
    right: 25px;

    border-width:
        0 1px 1px 0;

}


/* =========================================================
   SECOND PAGE
========================================================= */

.second {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:

        radial-gradient(
            circle at center,

            #154b9b 0%,

            #0a2c68 28%,

            #041936 65%,

            #010713 100%
        );

}


/* Energy */

.second-energy {

    position: absolute;

    width: 700px;
    height: 700px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            rgba(
                0,
                210,
                255,
                0.2
            ),

            transparent 68%
        );

    filter:
        blur(5px);

    animation:
        energyPulse
        4s ease-in-out infinite;

}


/* Grid */

.grid {

    position: absolute;

    inset: 0;

    opacity: 0.13;

    background-image:

        linear-gradient(
            rgba(
                0,
                210,
                255,
                0.2
            ) 1px,

            transparent 1px
        ),

        linear-gradient(
            90deg,

            rgba(
                0,
                210,
                255,
                0.2
            ) 1px,

            transparent 1px
        );

    background-size:
        50px 50px;

    transform:

        perspective(500px)
        rotateX(60deg)
        scale(2);

    transform-origin:
        center bottom;

}


/* =========================================================
   INFIGENDS
========================================================= */

.title {

    position: relative;

    z-index: 5;

    color: white;

    font-size:
        clamp(
            55px,
            10vw,
            150px
        );

    font-weight: 900;

    letter-spacing: 12px;

    text-align: center;

    text-shadow:

        0 0 5px white,

        0 0 15px white,

        0 0 30px #ffffff,

        0 0 60px #8eefff,

        0 0 100px #00cfff,

        0 0 160px #00aaff;

    animation:
        titleReveal
        2s ease forwards;

}


/* Subtitle */

.subtitle {

    position: absolute;

    margin-top: 180px;

    color: white;

    font-size:
        clamp(
            12px,
            2vw,
            20px
        );

    letter-spacing: 8px;

    text-transform: uppercase;

    text-shadow:

        0 0 8px white,

        0 0 20px #00d9ff;

    animation:
        fadeUp
        2s ease
        0.7s forwards;

    opacity: 0;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back {

    position: absolute;

    top: 35px;
    left: 35px;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    border:
        2px solid
        #55e7ff;

    background:
        rgba(
            0,
            130,
            190,
            0.15
        );

    color: white;

    font-size: 30px;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:

        0 0 15px #00bfff,

        inset
        0 0 15px
        rgba(
            0,
            210,
            255,
            0.2
        );

    transition:
        0.4s ease;

    z-index: 30;

}


.back:hover {

    transform:
        scale(1.15);

    box-shadow:

        0 0 25px white,

        0 0 50px #00d9ff,

        0 0 90px #00bfff;

}


/* =========================================================
   CREDITS PAGE
========================================================= */

.credits-page {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:

        radial-gradient(
            circle at center,

            #102f60 0%,

            #071b3b 40%,

            #020914 100%
        );

}


.credits-glow {

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            rgba(
                0,
                210,
                255,
                0.14
            ),

            transparent 70%
        );

    filter:
        blur(10px);

    animation:
        energyPulse
        4s infinite;

}


.credits-text {

    position: relative;

    z-index: 5;

    color: white;

    text-align: center;

    font-size:
        clamp(
            30px,
            6vw,
            85px
        );

    font-weight: 800;

    letter-spacing: 5px;

    text-shadow:

        0 0 8px white,

        0 0 20px white,

        0 0 40px #00d9ff,

        0 0 80px #00bfff;

    animation:
        titleReveal
        1.5s ease forwards;

}


/* =========================================================
   RAY ANIMATIONS
========================================================= */


/*
   All rays have exactly the same
   2-second duration, so they
   reach the center together.
*/


@keyframes rayFromTop {

    0% {

        top: -55vh;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        top: 18%;

        opacity: 0;

    }

}


@keyframes rayFromBottom {

    0% {

        bottom: -55vh;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        bottom: 18%;

        opacity: 0;

    }

}


@keyframes rayFromLeft {

    0% {

        left: -55vh;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        left: 18%;

        opacity: 0;

    }

}


@keyframes rayFromRight {

    0% {

        right: -55vh;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        right: 18%;

        opacity: 0;

    }

}


@keyframes diagonalTL {

    0% {

        top: -45vh;

        left: -5%;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        top: 18%;

        left: 34%;

        opacity: 0;

    }

}


@keyframes diagonalTR {

    0% {

        top: -45vh;

        right: -5%;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        top: 18%;

        right: 34%;

        opacity: 0;

    }

}


@keyframes diagonalBL {

    0% {

        bottom: -45vh;

        left: -5%;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        bottom: 18%;

        left: 34%;

        opacity: 0;

    }

}


@keyframes diagonalBR {

    0% {

        bottom: -45vh;

        right: -5%;

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    85% {

        opacity: 1;

    }

    100% {

        bottom: 18%;

        right: 34%;

        opacity: 0;

    }

}


/* =========================================================
   BUTTON ENERGY ORBIT
========================================================= */

@keyframes orbit {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


/* =========================================================
   GENERAL ANIMATIONS
========================================================= */

@keyframes breathe {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 0.6;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.06);

        opacity: 1;

    }

}


@keyframes corePulse {

    0%,
    100% {

        transform:
            scale(0.8);

        opacity: 0.4;

    }

    50% {

        transform:
            scale(1.2);

        opacity: 1;

    }

}


@keyframes energyPulse {

    0%,
    100% {

        transform:
            scale(0.8);

        opacity: 0.4;

    }

    50% {

        transform:
            scale(1.2);

        opacity: 1;

    }

}


@keyframes titleReveal {

    from {

        opacity: 0;

        transform:
            scale(0.7);

        filter:
            blur(15px);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

        filter:
            blur(0);

    }

}


@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .begin {

        width: 150px;
        height: 150px;

        font-size: 16px;

    }


    .credits-button {

        width: 85px;
        height: 85px;

        top: 20px;
        right: 20px;

        font-size: 11px;

    }


    .back {

        width: 65px;
        height: 65px;

        top: 20px;
        left: 20px;

        font-size: 25px;

    }


    .title {

        letter-spacing: 5px;

    }


    .subtitle {

        margin-top: 140px;

        letter-spacing: 4px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HOME PAGE
======================================================= -->

<section
    class="home"
    id="home">


    <!-- Background word -->

    <div
        class="background-title">

        YORO

    </div>


    <!-- Central energy -->

    <div
        class="energy-core">

    </div>


    <!-- ===================================================
         RAYS
    =================================================== -->

    <div
        class="ray-container">


        <!-- Vertical rays -->

        <div class="ray top"></div>
        <div class="ray bottom"></div>


        <!-- Horizontal rays -->

        <div class="ray left"></div>
        <div class="ray right"></div>


        <!-- Diagonal rays -->

        <div
            class="ray diagonal tl">
        </div>

        <div
            class="ray diagonal tr">
        </div>

        <div
            class="ray diagonal bl">
        </div>

        <div
            class="ray diagonal br">
        </div>


    </div>


    <!-- Corner decoration -->

    <div
        class="corner top-left">
    </div>

    <div
        class="corner bottom-right">
    </div>


    <!-- ===================================================
         CREDITS
    =================================================== -->

    <button
        class="credits-button"
        onclick="openCredits()">

        credits

    </button>


    <!-- ===================================================
         MAIN BUTTON
    =================================================== -->

    <button
        class="begin"
        onclick="openInfigends()">

        lets begin

        <!-- Dazzling orbit -->

        <span
            class="dazzle">
        </span>

    </button>


</section>



<!-- =======================================================
     INFIGENDS PAGE
======================================================= -->

<section
    class="second"
    id="second">


    <div
        class="second-energy">
    </div>


    <div
        class="grid">
    </div>


    <!-- BACK -->

    <button
        class="back"
        onclick="goBack()">

        ←

    </button>


    <!-- TITLE -->

    <div
        class="title">

        INFIGENDS

    </div>


    <!-- SUBTITLE -->

    <div
        class="subtitle">

        awakening of ragens

    </div>


</section>



<!-- =======================================================
     CREDITS PAGE
======================================================= -->

<section
    class="credits-page"
    id="creditsPage">


    <div
        class="credits-glow">
    </div>


    <!-- BACK -->

    <button
        class="back"
        onclick="goBack()">

        ←

    </button>


    <!-- CREDIT -->

    <div
        class="credits-text">

        all credits goes to mdju

    </div>


</section>



<script>

/* =========================================================
   OPEN INFIGENDS
========================================================= */

function openInfigends() {

    const home =
        document.getElementById(
            "home"
        );

    const second =
        document.getElementById(
            "second"
        );


    /*
       Save this page in browser
       history.
    */

    history.pushState(
        {
            page: "infigends"
        },

        "",

        "#infigends"
    );


    /*
       Cinematic transition.
    */

    home.style.opacity = "0";

    home.style.transform =
        "scale(1.08)";


    setTimeout(() => {

        home.style.display =
            "none";

        second.style.display =
            "flex";

    }, 700);

}


/* =========================================================
   OPEN CREDITS
========================================================= */

function openCredits() {

    const home =
        document.getElementById(
            "home"
        );

    const credits =
        document.getElementById(
            "creditsPage"
        );


    history.pushState(
        {
            page: "credits"
        },

        "",

        "#credits"
    );


    home.style.opacity = "0";

    home.style.transform =
        "scale(1.08)";


    setTimeout(() => {

        home.style.display =
            "none";

        credits.style.display =
            "flex";

    }, 700);

}


/* =========================================================
   BACK ARROW
========================================================= */

function goBack() {

    /*
       Go to the last visited
       browser-history page.
    */

    history.back();

}


/* =========================================================
   HISTORY CHANGE
========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const home =
            document.getElementById(
                "home"
            );

        const second =
            document.getElementById(
                "second"
            );

        const credits =
            document.getElementById(
                "creditsPage"
            );


        /*
           Hide everything first.
        */

        home.style.display =
            "none";

        second.style.display =
            "none";

        credits.style.display =
            "none";


        /*
           Show the correct page.
        */

        if (
            location.hash ===
            "#infigends"
        ) {

            second.style.display =
                "flex";

        }

        else if (
            location.hash ===
            "#credits"
